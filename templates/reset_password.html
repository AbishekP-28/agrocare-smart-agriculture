<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AgroCare</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: white;
            max-width: 450px;
            width: 100%;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .auth-card:hover { transform: translateY(-4px); }
        .logo { text-align: center; font-size: 48px; margin-bottom: 16px; }
        h1 { text-align: center; color: #2d5a2c; font-size: 28px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #555; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 14px; }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: #2d5a2c; }
        .password-toggle {
            position: absolute;
            right: 16px;
            cursor: pointer;
            font-size: 20px;
            color: #888;
            user-select: none;
        }
        .password-toggle:hover { color: #2d5a2c; }
        .btn {
            width: 100%;
            background: #2d5a2c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: #1b4e1a; transform: scale(1.02); }
        .bottom-text {
            text-align: center;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
            color: #666;
            font-size: 14px;
        }
        .bottom-text a { color: #2d5a2c; text-decoration: none; font-weight: bold; }
        .bottom-text a:hover { text-decoration: underline; }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .info {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        @media (max-width: 480px) {
            .auth-card { padding: 28px; }
            h1 { font-size: 24px; }
            .btn { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">🌱</div>
        <h1>Create New Password</h1>
        <div class="subtitle">Enter the reset code and your new password</div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if message %}<div class="info">{{ message }}</div>{% endif %}
        
        <form action="/reset-password" method="POST">
            <input type="hidden" name="mobile_number" value="{{ mobile_number }}">
            
            <div class="form-group">
                <label>Reset Code</label>
                <input type="text" name="reset_code" placeholder="Enter 6-digit reset code" required>
            </div>
            
            <div class="form-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <input type="password" name="new_password" id="new_password" placeholder="Enter new password" required>
                    <span class="password-toggle" onclick="togglePassword('new_password')">👁️</span>
                </div>
            </div>
            
            <div class="form-group">
                <label>Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password" required>
                    <span class="password-toggle" onclick="togglePassword('confirm_password')">👁️</span>
                </div>
            </div>
            
            <button type="submit" class="btn">Reset Password</button>
        </form>
        
        <div class="bottom-text">
            <a href="/login">← Back to Login</a>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const toggleIcon = event.target;
            if (input.type === 'password') {
                input.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                input.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
